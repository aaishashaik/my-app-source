name: Trigger DevOps Workflow

on:
  push:
    branches:
      - develop  # <-- this must match the branch you're pushing to

jobs:
  trigger-devops:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DevOps workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          token: ${{ secrets.DEVOPS_WORKFLOW_TOKEN }}  # <-- must match your secret name
          repository: aaishashaik/devops-workflows  # <-- your DevOps repo
          workflow: hello-world.yml  # <-- workflow filename in DevOps repo
          ref: devops-workflows  # <-- branch in DevOps repo where workflow lives
