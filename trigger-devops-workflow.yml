name: Trigger DevOps Workflow

on:
  push:
    branches:
      - develop

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger devops-workflows repo
        run: |
          response=$(curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEVOPS_WORKFLOW_TOKEN }}" \
            https://api.github.com/repos/aaishashaik/devops-workflows/dispatches \
            -d '{"event_type":"hello-world-trigger"}' -w "%{http_code}" -s -o /dev/null)
          echo "HTTP status code: $response"
